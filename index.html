<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
  </head>
  <body class="">
    <header class="text-light">
      <nav
        style="background-color: #130a3f !important"
        class="navbar navbar-expand-lg bg-body-tertiary"
        data-bs-theme="dark"
      >
        <div class="container-fluid">
          <a class="navbar-brand text-light" href="#">Tech Talk</a>
          <button
            class="navbar-toggler text-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon text-light"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section style="background-color: #0b1151">
        <div class="container-fluid text-light text-center py-5">
          <div class="w-75 container">
            <h1>Welcome to Tech Talk</h1>
            <p class="fs-3">
              The latest updates and insights on technology gadgets, and
              innovation
            </p>
            <button class="btn btn-primary">Read More</button>
          </div>
        </div>
      </section>

      <section class="m-3">
        <h2>Featured Article</h2>
        <div class="container-fluid">
          <div style="border-radius: 0; border: none" class="card mb-3">
            <div class="row g-0">
              <div class="col-4">
                <img
                  src="http://fakeimg.pl/200?font=lobster"
                  class="img-fluid"
                  alt="placeholder"
                />
              </div>
              <div class="col-8">
                <div class="card-body">
                  <h5 class="card-title">
                    The Future of Artificial Intelligence
                  </h5>
                  <p class="card-text">
                    Exploring the potential and challenges of artificial
                    intelligence in modern won
                  </p>
                  <p class="card-text">
                    <a href="#" class="text-decoration-none">Read More</a>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
